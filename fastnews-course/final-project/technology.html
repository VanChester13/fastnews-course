<!doctype html>
<html lang="ru">

          <h1>FastNews</h1>
          <img src="images/logo.png" alt="Логотип FastNews" />

        <!-- Навигация -->

      <main class="layout">

              <time datetime="2026-01-02">2 января 2026 года</time>

            </p>
          </article>
        </section>
        <!-- Популярное -->
        <aside class="popular">
          <h3>Популярное</h3>
          <ol>
            <li><a href="#news-2">Оперативная память дорожает</a></li>
          </ol>
        </aside>

      <!-- Подвал сайта -->
      <footer class="footer">
        <p>© FastNews, 2026</p>
